[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carla"
version = "0.1.0"
description = "CARLA public R0/R1 audio deepfake detection pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
  "torchaudio",
]

[project.optional-dependencies]
sofia = [
  "transformers==4.35.0",
  "soundfile",
]
dev = ["pytest==9.1.1"]
rawnet3 = ["soundfile", "asteroid-filterbanks"]
robustdetector = ["nnAudio", "soxr"]
neural-codecs = ["encodec==0.1.1", "descript-audio-codec==1.0.0"]

[tool.setuptools.packages.find]
include = ["carla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
